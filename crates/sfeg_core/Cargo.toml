[package]
name = "sfeg_core"
description = "SFEG's window-free core: game state, ticks, and time."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The core must never depend on winit, wgpu, or any other platform library (ADR 0007).
[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.2", features = ["bytemuck"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
ron = "0.12.3"
